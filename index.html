<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Landmark Mapper</title>
    <!-- Import elegant serif font for luxury aesthetic -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS Variables for Tiffany & Co. inspired theme */
        :root {
            --tiffany-blue: #81D8D0;
            --tiffany-blue-dark: #00857E;
            --bg-color: #ffffff;
            --border-color: #e0e0e0;
            --text-main: #222222;
            --text-muted: #777777;
            --elegant-red: #A73A3A;
        }

        * { box-sizing: border-box; }
        
        body { 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            padding: 50px 20px; 
            display: flex; 
            justify-content: center; 
            font-weight: 300;
            transition: padding-top 0.4s ease;
        }

        /* Reduced top margin state triggered via JS */
        body.uploaded-state {
            padding-top: 15px;
        }

        .container { 
            max-width: 800px; 
            width: 100%; 
            display: flex; 
            flex-direction: column; 
            gap: 25px; 
        }

        /* Header styling */
        #mainHeader {
            transition: opacity 0.3s ease;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 400;
            text-align: center;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin: 0 0 10px 0;
            color: var(--text-main);
        }
        
        /* 1. Image Canvas */
        #canvasContainer {
            width: 100%;
            background: #ffffff;
            border: 1px solid var(--border-color);
            padding: 20px;
            display: none;
            text-align: center;
        }
        canvas { 
            max-width: 100%; 
            display: block;
            margin: 0 auto;
            cursor: crosshair; 
        }

        /* 2. Log Box */
        #logBox {
            width: 100%;
            height: 200px;
            background-color: #fafafa;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 20px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            overflow-y: auto;
            display: none; 
            flex-direction: column;
            gap: 8px;
        }
        .log-line {
            line-height: 1.5;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 6px;
            word-break: break-all;
        }
        .log-line:last-child {
            border-bottom: none;
        }
        .log-highlight { color: var(--tiffany-blue-dark); font-weight: 600; }
        .log-info { color: #555555; }
        .log-error { color: var(--elegant-red); }

        /* 3. Instruction Message */
        #instructionMessage {
            color: var(--elegant-red);
            font-family: 'Playfair Display', serif;
            font-size: 16px;
            font-style: italic;
            text-align: center;
            letter-spacing: 0.03em;
            display: none; 
        }

        /* 4. Dropzone */
        #dropzone {
            width: 100%;
            padding: 30px 20px;
            border: 1px solid var(--border-color);
            background-color: #fafafa;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }
        #dropzone::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 2px;
            background-color: var(--tiffany-blue);
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }
        #dropzone:hover::after, #dropzone.dragover::after {
            width: 100%;
        }
        #dropzone.disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }
        
        /* FontAwesome Upload Icon styling */
        #dropzone i {
            font-size: 28px;
            color: var(--tiffany-blue-dark);
            margin-bottom: 8px;
            transition: color 0.3s ease;
        }
        #dropzone:hover i {
            color: var(--tiffany-blue);
        }

        #dropzone p { 
            margin: 0; 
            font-family: 'Playfair Display', serif;
            font-size: 14px; 
            color: var(--text-main); 
            letter-spacing: 0.02em;
            display: none; /* Text hidden to favor icon */
        }
        #dropzone span { 
            font-size: 11px; 
            color: var(--text-muted); 
            text-transform: uppercase;
            letter-spacing: 0.1em;
            display: block;
            margin-top: 8px;
        }
        input[type="file"] { display: none; }

        /* 5. Elegant Credit Footer */
        footer {
            font-family: 'Playfair Display', serif;
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
            letter-spacing: 0.08em;
            margin-top: 10px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- Header -->
        <header id="mainHeader">
            <h1>Landmark Mapper</h1>
        </header>

        <!-- Canvas Area -->
        <div id="canvasContainer">
            <canvas id="canvas"></canvas>
        </div>

        <!-- Log Output Area -->
        <div id="logBox"></div>

        <!-- Instruction Message -->
        <div id="instructionMessage">Click on the photo to see the area marked.</div>

        <!-- Dropzone Area -->
        <div id="dropzone" class="disabled">
            <!-- Replacing text with FontAwesome Icon -->
            <i id="dropzoneIcon" class="fa-solid fa-spinner fa-spin"></i>
            <p id="dropzoneText"></p>
            <span id="dropzoneSubText">Loading model...</span>
            <input type="file" id="fileInput" accept=".jpg, .jpeg, image/jpeg">
        </div>

        <!-- Credit Footer -->
        <footer>Coded by Seung Seog Han x Gemini Pro</footer>

    </div>

    <script type="module">
        import {
            FaceLandmarker,
            FilesetResolver
        } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm";

        // ==========================================
        // Logging Utility
        // ==========================================
        const logBox = document.getElementById('logBox');
        function addLog(message, type = "normal") {
            const line = document.createElement('div');
            line.className = 'log-line';
            
            let contentStyle = "";
            if(type === "error") contentStyle = 'class="log-error"';
            else if(type === "highlight") contentStyle = 'class="log-highlight"';
            else if(type === "info") contentStyle = 'class="log-info"';
            
            line.innerHTML = `<span ${contentStyle}>${message}</span>`;
            logBox.appendChild(line);
            logBox.scrollTop = logBox.scrollHeight;
        }

        // ==========================================
        // FaceRegionMapper Class
        // ==========================================
        class FaceRegionMapper {
            constructor(tesselationConnections) {
                const { triangles, adj } = this._buildTriangles(tesselationConnections);
                this.triangles = triangles;
                this.adj = adj;
                this.triangleIds = this._generateIds(this.triangles.length);
            }
            _buildTriangles(connections) {
                const adj = {};
                connections.forEach(({start, end}) => {
                    if (!adj[start]) adj[start] = new Set();
                    if (!adj[end]) adj[end] = new Set();
                    adj[start].add(end);
                    adj[end].add(start);
                });
                const trianglesMap = new Set();
                for (let uStr in adj) {
                    let u = parseInt(uStr);
                    for (let v of adj[u]) {
                        if (v > u) {
                            for (let w of adj[v]) {
                                if (w > v && adj[u].has(w)) {
                                    trianglesMap.add(`${u},${v},${w}`);
                                }
                            }
                        }
                    }
                }
                const triangles = Array.from(trianglesMap)
                    .map(str => str.split(',').map(Number))
                    .sort((a, b) => a[0]-b[0] || a[1]-b[1] || a[2]-b[2]);
                return { triangles, adj };
            }
            _generateIds(count) {
                const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
                const ids = [];
                let length = 2;
                while (ids.length < count) {
                    const generate = (prefix, l) => {
                        if (ids.length >= count) return;
                        if (l === 0) { ids.push(prefix); return; }
                        for (let i = 0; i < chars.length; i++) generate(prefix + chars[i], l - 1);
                    }
                    generate("", length);
                    length++;
                }
                return ids;
            }
            _isPointInTriangle(pt, v1, v2, v3) {
                const sign = (p1, p2, p3) => (p1.x - p3.x) * (p2.y - p3.y) - (p2.x - p3.x) * (p1.y - p3.y);
                const d1 = sign(pt, v1, v2);
                const d2 = sign(pt, v2, v3);
                const d3 = sign(pt, v3, v1);
                const has_neg = (d1 < 0) || (d2 < 0) || (d3 < 0);
                const has_pos = (d1 > 0) || (d2 > 0) || (d3 > 0);
                return !(has_neg && has_pos);
            }
            getLesionTriangleId(box, landmarks) {
                if (!box || !landmarks) return "UNKNOWN";
                const cx = (box.xMin + box.xMax) / 2.0;
                const cy = (box.yMin + box.yMax) / 2.0;
                const pt = { x: cx, y: cy };
                for (let i = 0; i < this.triangles.length; i++) {
                    const [idx1, idx2, idx3] = this.triangles[i];
                    if (this._isPointInTriangle(pt, landmarks[idx1], landmarks[idx2], landmarks[idx3])) {
                        return this.triangleIds[i];
                    }
                }
                return "OUT_OF_BOUNDS";
            }
        }

        // ==========================================
        // UI and Main Logic
        // ==========================================
        let faceLandmarker, regionMapper;
        let currentLandmarksPixel = null;
        let isModelLoaded = false;
        
        let baseImageData = null; 
        let blinkInterval = null; 

        const mainHeader = document.getElementById('mainHeader');
        const dropzone = document.getElementById('dropzone');
        const dropzoneIcon = document.getElementById('dropzoneIcon');
        const fileInput = document.getElementById('fileInput');
        const dropzoneSubText = document.getElementById('dropzoneSubText');
        const canvasContainer = document.getElementById('canvasContainer');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const instructionMessage = document.getElementById('instructionMessage');

        const tiffanyBlueRgb = "129, 216, 208"; 

        async function initModel() {
            try {
                const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
                faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task`,
                        delegate: "GPU"
                    },
                    outputFaceBlendshapes: false,
                    runningMode: "IMAGE",
                    numFaces: 1
                });

                regionMapper = new FaceRegionMapper(FaceLandmarker.FACE_LANDMARKS_TESSELATION);
                
                isModelLoaded = true;
                dropzone.classList.remove('disabled');
                
                // Switch icon to an elegant upload icon
                dropzoneIcon.className = "fa-solid fa-arrow-up-from-bracket";
                dropzoneSubText.innerHTML = "JPG / JPEG";
                
                logBox.style.display = "flex";
                addLog("Model loaded.", "highlight");
            } catch (error) {
                dropzoneIcon.className = "fa-solid fa-triangle-exclamation";
                dropzoneSubText.innerHTML = "Load failed";
                logBox.style.display = "flex";
                addLog(`Load error: ${error.message}`, "error");
            }
        }

        function handleFile(file) {
            if (!isModelLoaded) return;
            
            if (file.type !== "image/jpeg" && file.type !== "image/jpg") {
                addLog(`Invalid format: ${file.name}`, "error");
                return;
            }

            if (blinkInterval) clearInterval(blinkInterval);

            // Hide header & reduce margin dynamically
            mainHeader.style.display = "none";
            document.body.classList.add('uploaded-state');
            
            addLog(`Analyzing '${file.name}'...`);
            canvasContainer.style.display = "none";
            instructionMessage.style.display = "none";

            const img = new Image();
            img.onload = () => processImage(img);
            img.src = URL.createObjectURL(file);
        }

        function processImage(img) {
            const startTime = performance.now();
            const results = faceLandmarker.detect(img);
            const endTime = performance.now();
            
            if (results.faceLandmarks.length > 0) {
                const landmarks = results.faceLandmarks[0];
                
                const originalLandmarksPixel = landmarks.map(lm => ({
                    x: lm.x * img.width,
                    y: lm.y * img.height
                }));

                const xCoords = originalLandmarksPixel.map(lm => lm.x);
                const yCoords = originalLandmarksPixel.map(lm => lm.y);
                const xMinRaw = Math.min(...xCoords);
                const yMinRaw = Math.min(...yCoords);
                const xMaxRaw = Math.max(...xCoords);
                const yMaxRaw = Math.max(...yCoords);
                
                const MARGIN = 15; 
                const xMin = Math.max(0, xMinRaw - MARGIN);
                const yMin = Math.max(0, yMinRaw - MARGIN);
                const xMax = Math.min(img.width, xMaxRaw + MARGIN);
                const yMax = Math.min(img.height, yMaxRaw + MARGIN);

                const cropWidth = xMax - xMin;
                const cropHeight = yMax - yMin;

                canvas.width = cropWidth;
                canvas.height = cropHeight;
                ctx.drawImage(img, xMin, yMin, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);

                currentLandmarksPixel = originalLandmarksPixel.map(lm => ({
                    x: lm.x - xMin,
                    y: lm.y - yMin
                }));

                ctx.strokeStyle = `rgba(${tiffanyBlueRgb}, 0.5)`;
                ctx.lineWidth = 0.5;
                regionMapper.triangles.forEach(tri => {
                    const p1 = currentLandmarksPixel[tri[0]];
                    const p2 = currentLandmarksPixel[tri[1]];
                    const p3 = currentLandmarksPixel[tri[2]];
                    
                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.lineTo(p3.x, p3.y);
                    ctx.closePath();
                    ctx.stroke();
                });

                ctx.fillStyle = `rgba(${tiffanyBlueRgb}, 0.9)`;
                currentLandmarksPixel.forEach(lm => {
                    ctx.beginPath();
                    ctx.arc(lm.x, lm.y, 1.2, 0, 2 * Math.PI);
                    ctx.fill();
                });

                ctx.strokeStyle = "rgba(0, 0, 0, 0.4)";
                ctx.lineWidth = 1.5;
                ctx.strokeRect(0, 0, cropWidth, cropHeight);

                baseImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

                canvasContainer.style.display = "block";
                instructionMessage.style.display = "block";
                
                addLog(`Face detected (${Math.round(endTime - startTime)}ms)`);
            } else {
                currentLandmarksPixel = null;
                
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);

                canvasContainer.style.display = "block";
                instructionMessage.style.display = "none";
                addLog(`Face not detected.`, "error");
            }
        }

        // ==========================================
        // Event Binding
        // ==========================================
        dropzone.addEventListener('click', () => { if (isModelLoaded) fileInput.click(); });
        fileInput.addEventListener('change', (e) => { if (e.target.files.length) handleFile(e.target.files[0]); fileInput.value = ""; });
        dropzone.addEventListener('dragover', (e) => { e.preventDefault(); if (isModelLoaded) dropzone.classList.add('dragover'); });
        dropzone.addEventListener('dragleave', () => { dropzone.classList.remove('dragover'); });
        dropzone.addEventListener('drop', (e) => { e.preventDefault(); dropzone.classList.remove('dragover'); if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]); });

        canvas.addEventListener('mousedown', (e) => {
            if (!currentLandmarksPixel || !regionMapper || !baseImageData) return;

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const clickX = (e.clientX - rect.left) * scaleX;
            const clickY = (e.clientY - rect.top) * scaleY;

            const dummyBox = { xMin: clickX, yMin: clickY, xMax: clickX, yMax: clickY };
            const triangleId = regionMapper.getLesionTriangleId(dummyBox, currentLandmarksPixel);

            if (triangleId === "OUT_OF_BOUNDS") {
                addLog(`Out of bounds`, "error");
                return;
            }

            const triIndex = regionMapper.triangleIds.indexOf(triangleId);
            const [idx1, idx2, idx3] = regionMapper.triangles[triIndex];
            const p1 = currentLandmarksPixel[idx1];
            const p2 = currentLandmarksPixel[idx2];
            const p3 = currentLandmarksPixel[idx3];

            const tMinX = Math.min(p1.x, p2.x, p3.x);
            const tMaxX = Math.max(p1.x, p2.x, p3.x);
            const tMinY = Math.min(p1.y, p2.y, p3.y);
            const tMaxY = Math.max(p1.y, p2.y, p3.y);

            addLog(`[${triangleId}] Clicked at X:${Math.round(clickX)}, Y:${Math.round(clickY)}`, "highlight");
            addLog(`Box: X(${Math.round(tMinX)}~${Math.round(tMaxX)}), Y(${Math.round(tMinY)}~${Math.round(tMaxY)})`, "info");
            addLog(`Landmarks: 1(${Math.round(p1.x)},${Math.round(p1.y)}), 2(${Math.round(p2.x)},${Math.round(p2.y)}), 3(${Math.round(p3.x)},${Math.round(p3.y)})`, "info");

            if (blinkInterval) clearInterval(blinkInterval); 
            
            let blinkCount = 0;
            blinkInterval = setInterval(() => {
                ctx.putImageData(baseImageData, 0, 0);
                
                if (blinkCount % 2 === 0) {
                    ctx.fillStyle = `rgba(${tiffanyBlueRgb}, 0.7)`; 
                    ctx.strokeStyle = `rgba(${tiffanyBlueRgb}, 1)`; 
                    ctx.lineWidth = 1.5;
                    
                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.lineTo(p3.x, p3.y);
                    ctx.closePath();
                    
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = "#222222";
                    ctx.beginPath();
                    ctx.arc(clickX, clickY, 3, 0, 2 * Math.PI);
                    ctx.fill();
                }

                blinkCount++;

                if (blinkCount > 6) {
                    clearInterval(blinkInterval);
                    
                    ctx.putImageData(baseImageData, 0, 0);
                    ctx.fillStyle = `rgba(${tiffanyBlueRgb}, 0.8)`;
                    ctx.strokeStyle = `rgba(${tiffanyBlueRgb}, 1)`;
                    ctx.lineWidth = 1.5;
                    
                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.lineTo(p3.x, p3.y);
                    ctx.closePath();
                    
                    ctx.fill();
                    ctx.stroke();
                    
                    ctx.fillStyle = "#222222";
                    ctx.beginPath();
                    ctx.arc(clickX, clickY, 3, 0, 2 * Math.PI);
                    ctx.fill();
                }
            }, 120); 
        });

        initModel();
    </script>
</body>
</html>
